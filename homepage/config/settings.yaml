title: Homelab Dashboard
theme: dark
color: blue
headerStyle: boxed
hideVersion: false
showPoweredBy: true
style: grid
layout:
  - tab: Services
    sections:
      - Media:
          style: grid
          columns: 2
      - Productivity:
          style: grid
          columns: 2
      - AI & Research:
          style: grid
          columns: 2
      - Infrastructure:
          style: grid
          columns: 2
  - tab: System
    sections:
      - Monitoring:
          style: grid
          columns: 2
      - Logs:
          style: grid
          columns: 2
  - tab: Explore
    sections:
      - Links:
          style: grid
          columns: 3
header:
  - datetime:
      format:
        date: YYYY-MM-DD
        time: HH:mm:ss
  - weather:
      provider: open-meteo
      location:
        latitude: 40.7128
        longitude: -74.0060
      # Alternative: use weatherapi or another provider
      # You'll need to get an API key for most weather providers
      # For open-meteo, no API key is needed for basic usage
footer:
  - version:
      text: Homelab Control Panel
background:
  image: https://images.unsplash.com/photo-1506905925346-21bda4d32df4?auto=format&fit=crop&w=1920&q=80
  blur: 0                 # 0 = crisp mountains (no blur)
  opacity: 65
  attachment: fixed
  position: center
  repeat: no-repeat
  size: cover
cardBlur: 0             # 0 = sharp cards (no blur behind cards)
opacity: 90
footerStyle: small
statusStyle: none
