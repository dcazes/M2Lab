title: Homelab Dashboard
theme: dark
color: blue
headerStyle: boxed
hideVersion: false
showPoweredBy: true
style: grid
layout:
  - tab: Services
    sections:
      - Media:
          style: grid
          columns: 2
      - Productivity:
          style: grid
          columns: 2
      - AI & Research:
          style: grid
          columns: 2
      - Infrastructure:
          style: grid
          columns: 2
  - tab: System
    sections:
      - Monitoring:
          style: grid
          columns: 2
      - Logs:
          style: grid
          columns: 2
  - tab: Explore
    sections:
      - Links:
          style: grid
          columns: 3
header:
  - datetime:
      format: 
        date: YYYY-MM-DD
        time: HH:mm:ss
  - weather:
      provider: open-meteo
      location: 
        latitude: 40.7128
        longitude: -74.0060
      # Alternative: use weatherapi or another provider
      # You'll need to get an API key for most weather providers
      # For open-meteo, no API key is needed for basic usage
footer:
  - version:
      text: Homelab Control Panel
background:
  image: https://images.unsplash.com/photo-1555066931-4365d14bab8c?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1470&q=80
  blur: 20
  opacity: 80
  attachment: fixed
  position: center
  repeat: no-repeat
  size: cover
cardBlur: 10
opacity: 90
footerStyle: small