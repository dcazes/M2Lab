# =============================================================================
# Homepage services.yaml  —  what cards appear + the URL each card opens
# -----------------------------------------------------------------------------
# HOW TO EDIT MANUALLY (full guide in homepage/config/HOMEPAGE_CONFIG.md):
#   * Each "- GroupName:" is a column/tab. List services under it.
#   * Fields: icon, href (URL opened on click), description, (optional) siteMonitor.
#   * Service id in HomeServer/services.yaml MUST equal the Docker compose
#     project name used by custom.js (see custom.js NAME_TO_PROJECT).
#   * All hrefs below use the SECURE Tailscale URL https://home.taile2cc7a.ts.net
#     (Tailscale Serve terminates TLS with a real Let's Encrypt cert — no cert
#     files to manage). If you rename the Tailscale machine, update these host
#     names. After editing, Homepage hot-reloads (no restart needed).
# =============================================================================

