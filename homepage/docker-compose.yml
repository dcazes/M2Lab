services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:3000"
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Hosts Homepage accepts in the HTTP Host header. Must include the
      # Tailscale hostname you open it from (https://home.taile2cc7a.ts.net)
      # and localhost for direct access. Update this if you rename the host.
      HOMEPAGE_ALLOWED_HOSTS: localhost:8083,127.0.0.1:8083,home.taile2cc7a.ts.net,home.taile2cc7a.ts.net:443
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
      - /run
    networks:
      - frontend-net
      - backend-net
networks:
  frontend-net:
    external: true
    name: homelab_frontend
  backend-net:
    external: true
    name: homelab_backend
