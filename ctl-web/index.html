<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Homelab</title>
<style>
:root{--bg:#0e1116;--card:#161b22;--fg:#e6edf3;--mut:#8b949e;--ok:#3fb950;--bad:#f85149;--warn:#d29922;--acc:#58a6ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
main{max-width:960px;margin:0 auto;padding:24px 16px}
h1{font-size:20px;margin:0 0 4px}.sub{color:var(--mut);margin-bottom:20px}
.sys{display:flex;gap:18px;color:var(--mut);font-size:13px;margin-bottom:16px;flex-wrap:wrap}
.bar{height:6px;background:#21262d;border-radius:3px;width:120px;display:inline-block;vertical-align:middle;margin-left:6px}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--acc)}
.grid{display:grid;gap:12px}
.card{background:var(--card);border:1px solid #21262d;border-radius:10px;padding:14px 16px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.name{font-weight:600;font-size:16px}.desc{color:var(--mut);font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mut);flex:none}
.dot.running{background:var(--ok)}.dot.stopped,.dot.absent{background:#484f58}
.dot.degraded{background:var(--warn)}
.pill{font-size:11px;color:var(--mut);border:1px solid #30363d;padding:1px 8px;border-radius:99px}
button{background:#21262d;color:var(--fg);border:1px solid #30363d;border-radius:6px;
 padding:5px 12px;font-size:13px;cursor:pointer}button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);border-color:var(--acc);color:#04121f;font-weight:600}
button.danger{color:var(--bad)}
a{color:var(--acc);text-decoration:none}
.actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.global{display:flex;gap:8px;margin:18px 0}
#logbox{display:none;background:#010409;border:1px solid #30363d;border-radius:10px;
 margin-top:14px;padding:10px;height:340px;overflow:auto;font:12px ui-monospace,monospace;white-space:pre-wrap}
.c{color:var(--acc)}
@media(max-width:640px){.actions{margin-left:0;width:100%}}
</style></head><body><main>
<h1>🏠 Homelab</h1><div class="sub">local control plane</div>
<div class="sys" id="sys"></div>
<div class="global">
 <button class="primary" onclick="all_('up')">START ALL</button>
 <button onclick="all_('stop')">STOP ALL</button>
 <button onclick="all_('update')">UPDATE ALL</button>
</div>
<div class="grid" id="grid"></div>
<pre id="logbox"></pre>
</main>
<script>
const $=q=>document.querySelector(q);let es=null;
const DOT=s=>`<span class="dot ${s}"></span>`;
const isTailnet = location.hostname.includes(".taile2cc7a.ts.net");
async function j(url,opt){const r=await fetch(url,opt);if(!r.ok)throw new Error(await r.text());return r.json()}
async function refresh(){
 const {services}=await j('/api/services');
 $('#grid').innerHTML=services.map(s=>`
 <div class="card"><div class="row">
  <span>${DOT(s.state)}</span>
  <div><div class="row"><span class="name">${s.icon} ${s.display_name}</span>
   <span class="pill">${s.state}${s.healthy===false?' · unhealthy':''}</span>
   <span class="pill">:${s.port}</span></div>
   <div class="desc">${s.description||''}</div></div>
  <div class="actions">
   ${(s.url||s.tailnet_url)&&s.state==='running'?`<a href="${isTailnet && s.tailnet_url ? s.tailnet_url : s.url}" target="_blank"><button>Open</button></a>`:''}
   ${s.state==='running'
     ?`<button onclick="act('${s.id}','stop')">Stop</button>`
     :`<button class="primary" onclick="act('${s.id}','up')">Start</button>`}
   <button onclick="act('${s.id}','restart')">Restart</button>
   <button onclick="act('${s.id}','update')">Update</button>
   <button onclick="showLogs('${s.id}')">Logs</button>
  </div></div></div>`).join('');
}
async function sys(){
 const d=await j('/api/system');const g=x=>Math.round(x);
 $('#sys').innerHTML=`<span>CPU ${g(d.cpu_percent)}%<span class="bar"><i style="width:${g(d.cpu_percent)}%"></i></span></span>
 <span>RAM ${g(d.mem.percent)}%<span class="bar"><i style="width:${g(d.mem.percent)}%"></i></span></span>
 <span>DISK ${g(d.disk.percent)}%<span class="bar"><i style="width:${g(d.disk.percent)}%"></i></span></span>
 <span>Docker ${d.docker_ok?'●':'○'}</span>`;
}
async function act(id,a){
 if(a==='restart'&&!confirm(`Restart ${id}?`))return;
 const b=$('#logbox');b.style.display='block';b.textContent+=`$ ${id} ${a}…\n`;
 try{const r=await j(`/api/services/${id}/${a}`,{method:'POST'});
     b.textContent+=(r.output||'(done)')+'\n'}catch(e){b.textContent+='ERROR '+e+'\n'}
 b.scrollTop=b.scrollHeight;refresh();
}
async function all_(a){
 if(!confirm(`${a.toUpperCase()} ALL services?`))return;
 for(const {id} of (await j('/api/services')).services) await act(id,a);
}
function showLogs(id){
 const b=$('#logbox');b.style.display='block';b.textContent='';
 if(es)es.close();
 es=new EventSource(`/api/services/${id}/logs?tail=300`);
 es.onmessage=e=>{const{c,line}=JSON.parse(e.data);
  b.textContent+=`<span class="c">${c}</span>|${line}\n`;b.scrollTop=b.scrollHeight};
 es.onerror=()=>{b.textContent+='— stream closed —\n';es.close()};
}
refresh();sys();setInterval(refresh,3000);setInterval(sys,5000);
</script></body></html>
