name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-and-linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Secret scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CHARSET_BINARY: true

      - name: YAML Linting
        run: |
          pip install yamllint
          yamllint -f parsable .

      - name: Trivy configuration scan (IaC)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          # Exclude directories that are not needed (like .git, volumes)
          exclude-dir: .git,postgres_data,redis_data,.*_data,.*/data,pgdata

  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible-lint
        run: pip install ansible-lint

      - name: Run ansible-lint on bootstrap playbooks
        run: ansible-lint ansible/

  compose-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate compose configs
        run: |
          fail=0
          for f in $(git ls-files '*/docker-compose.yml' 'docker-compose.yml'); do
            echo -n "$f ... "
            rc=0
            out=$(docker compose -f "$f" config 2>&1) || rc=$?
            if [ $rc -eq 0 ]; then
              echo OK
            elif echo "$out" | grep -qi "env.*not set\|variable.*not set\|not found\|No such file"; then
              echo "SKIP (needs .env)"
            else
              echo "FAIL"; echo "$out" | tail -3; fail=1
            fi
          done
          exit $fail

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ctl-web-next/package-lock.json

      - name: Build dashboard
        run: npm ci && npm run build
        working-directory: ctl-web-next
