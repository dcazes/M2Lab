services:
  opencode-agent:
    image: ghcr.io/anomalyco/opencode:latest
    container_name: opencode-agent
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    restart: unless-stopped
    mem_limit: 4g
    cpus: 2
    ports:
      - "127.0.0.1:4096:4096"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      XDG_DATA_HOME: /data
      OPENCODE_CONFIG_DIR: /config
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?set in opencode-agent/.env}
      OPENCODE_DISABLE_AUTOUPDATE: "true"
      OPENCODE_DISABLE_MODELS_FETCH: "true"
      CTL_MCP_TOKEN: ${CTL_MCP_TOKEN:?set in opencode-agent/.env}
    volumes:
      # Full repo bind — agent edits the stack
      - ..:/workspace:rw
      # Config (agents, skills, opencode.json) read-only
      - ./config:/config:ro
      # Persistent session/state volume
      - opencode-data:/data
      # Docker socket for full container control
      - /var/run/docker.sock:/var/run/docker.sock:rw
    networks:
      - frontend-net
    healthcheck:
      test: ["CMD-SHELL", "bash -c '(exec 3<>/dev/tcp/localhost/4096) 2>/dev/null'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    command: >
      sh -c '
        mkdir -p /data/opencode &&
        echo "Waiting for LiteLLM at litellm-proxy:4000...";
        for i in {1..30}; do
          if (exec 3<>/dev/tcp/litellm-proxy/4000) 2>/dev/null; then
            echo "LiteLLM reachable.";
            break;
          fi;
          sleep 2;
        done;
        echo "Starting OpenCode web UI on 0.0.0.0:4096";
        exec opencode web --hostname 0.0.0.0 --port 4096
      '
volumes:
  opencode-data:

networks:
  frontend-net:
    external: true
    name: homelab_frontend
