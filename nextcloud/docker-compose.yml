services:
  app:
    image: nextcloud:apache
    container_name: nextcloud
    restart: unless-stopped
    depends_on:
      - db
      - redis
    ports:
      - "127.0.0.1:8020:80"
    volumes:
      - ./html:/var/www/html
      - ./data:/var/www/html/data
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DBPASSWORD}
      REDIS_HOST: redis
      # Hosts Nextcloud accepts. Include localhost (direct) and the secure
      # Tailscale URL. Update the tailnet host if you rename the machine.
      NEXTCLOUD_TRUSTED_DOMAINS: localhost:8020 home.taile2cc7a.ts.net:8453
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1000:1000"
    networks:
      frontend-net:
        internal: false
      backend-net:
        internal: true
  db:
    image: postgres:17
    container_name: nextcloud-db
    restart: unless-stopped
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DBPASSWORD}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1000:1000"
    networks:
      backend-net:
        internal: true
  redis:
    image: redis:7
    container_name: nextcloud-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1000:1000"
    networks:
      backend-net:
        internal: true
  cron:
    image: nextcloud:apache
    container_name: nextcloud-cron
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./html:/var/www/html
      - ./data:/var/www/html/data
    entrypoint: /cron.sh
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1000:1000"
    networks:
      backend-net:
        internal: true
networks:
  frontend-net:
    internal: false
  backend-net:
    internal: true