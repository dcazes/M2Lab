services:
  litellm-mcp:
    build: .
    image: litellm-mcp:latest
    container_name: litellm-mcp
    restart: unless-stopped
    networks:
      - frontend-net
      - mcp-net
    ports:
      - "127.0.0.1:8462:8000"
    environment:
      LITELLM_BASE_URL: http://litellm-proxy:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set in litellm-mcp/.env}
      LITELLM_MCP_TOKEN: ${LITELLM_MCP_TOKEN:?set in litellm-mcp/.env}

networks:
  frontend-net:
    external: true
    name: homelab_frontend
  mcp-net:
    external: true
    name: homelab_mcp
