---
- name: Bootstrap homelab host
  hosts: homelab
  become: true
  gather_facts: true
  roles:
    - base
    - docker
    - tailscale
    - firewall
  post_tasks:
    # tracks main by design; pinning would freeze rebuilds
    - name: Clone or update homelab repository  # noqa: latest[git]
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ repo_path }}"
        update: true
      become: false
