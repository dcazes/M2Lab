---
# Docker Engine from the official apt repo + Compose plugin, plus the two
# shared external networks every stack references.

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Resolve Docker repo distro slug
  ansible.builtin.set_fact:
    docker_distro_slug: "{{ 'debian' if ansible_distribution == 'Debian' else 'ubuntu' }}"

- name: Map CPU architecture for apt
  ansible.builtin.set_fact:
    docker_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"

- name: Download Docker official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/{{ docker_distro_slug }}/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ docker_distro_slug }} {{ ansible_distribution_release }} stable"
    filename: docker
    state: present

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Enable and start Docker daemon
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Ensure homelab user has docker group membership
  ansible.builtin.user:
    name: "{{ docker_user }}"
    groups: docker
    append: true

- name: Check whether shared frontend network exists
  ansible.builtin.command: docker network inspect homelab_frontend
  register: front_net_check
  failed_when: false
  changed_when: false

- name: Create shared frontend network (internet egress allowed)
  ansible.builtin.command: docker network create homelab_frontend
  when: front_net_check.rc != 0

- name: Check whether shared backend network exists
  ansible.builtin.command: docker network inspect homelab_backend
  register: back_net_check
  failed_when: false
  changed_when: false

- name: Create shared backend network (internal, no egress)
  ansible.builtin.command: docker network create --internal homelab_backend
  when: back_net_check.rc != 0

- name: Check whether shared mcp network exists
  ansible.builtin.command: docker network inspect homelab_mcp
  register: docker_mcp_net_check
  failed_when: false
  changed_when: false

- name: Create shared mcp network (service mcp sidecars)
  ansible.builtin.command: docker network create homelab_mcp
  when: docker_mcp_net_check.rc != 0
  changed_when: true
