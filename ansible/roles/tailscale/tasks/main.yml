---
# Install Tailscale and join the tailnet. With no authkey configured the play
# stops short of joining and tells you the one command to run by hand.

- name: Check whether tailscale CLI exists
  ansible.builtin.command: which tailscale
  register: tailscale_binary
  changed_when: false
  failed_when: false

- name: Download Tailscale install script
  ansible.builtin.get_url:
    url: https://tailscale.com/install.sh
    dest: /tmp/tailscale-install.sh
    mode: "0755"
  when: tailscale_binary.rc != 0

- name: Install Tailscale (official install script)
  ansible.builtin.command: sh /tmp/tailscale-install.sh
  when: tailscale_binary.rc != 0
  changed_when: true

- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Read tailscale status
  ansible.builtin.command: tailscale status
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Join tailnet with auth key
  ansible.builtin.command:
    cmd: >-
      tailscale up --hostname=home {{ tailscale_extra_args }}
      --authkey={{ tailscale_authkey }}
  when:
    - tailscale_status.rc != 0
    - tailscale_authkey | length > 0
  no_log: true
  changed_when: true

- name: Manual join required (no authkey configured)
  ansible.builtin.debug:
    msg: >-
      Tailscale is installed but not joined.
      Run: sudo tailscale up --hostname=home
      (or set tailscale_authkey in group_vars/all.yml for unattended join).
  when:
    - tailscale_status.rc != 0
    - tailscale_authkey | length == 0
