name: open-webui

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "127.0.0.1:8084:8080"
    environment:
      # Connection to LiteLLM (routes: FreeLLMAPI free models + paid keys + Ollama fallback)
      - OPENAI_API_BASE_URL=http://host.docker.internal:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      # Auth + session
      - WEBUI_AUTH=True
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - WEBUI_NAME=Homelab Agent
      # Native OIDC stays disabled until these are populated in the host-only
      # .env after the Authentik provider/callback preflight has passed.
      - OPENID_PROVIDER_URL=${OPENID_PROVIDER_URL:-}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID:-}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET:-}
      - OPENID_REDIRECT_URI=${OPENID_REDIRECT_URI:-}
      - OAUTH_SCOPES=${OAUTH_SCOPES:-openid profile email groups}
      - ENABLE_OAUTH_SIGNUP=${ENABLE_OAUTH_SIGNUP:-false}
      - OAUTH_AUTO_REDIRECT=${OAUTH_AUTO_REDIRECT:-false}
      - ENABLE_LOGIN_FORM=${ENABLE_LOGIN_FORM:-true}
    volumes:
      - ./data:/app/backend/data
    # Authentik is published by the host's private Caddy bridge. Docker for
    # Linux does not provide this hostname automatically, so declare it
    # explicitly for both OIDC discovery and the LiteLLM connection above.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
