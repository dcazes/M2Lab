services:
  litellm-proxy:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    command: ["--config", "/app/litellm_config.yaml", "--port", "4000"]
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/litellm_config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      FREE_LLMAPI_API_KEY: ${FREE_LLMAPI_API_KEY}
      DATABASE_URL: ${DATABASE_URL}
      STORE_MODEL_IN_DB: "True"
    networks:
      - frontend-net
      - backend-net
    depends_on:
      litellm-db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Hardening: stock image expects root fs writes at runtime
    # (litellm writes to /app/.litellm, /tmp) — cap_drop +
    # no-new-privileges still applied.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: wget -q --spider http://localhost:4000/health/liveliness || exit 1
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  # UI/session/model-store database. Backend-net only, no published ports.
  # Stock postgres entrypoint needs its default privileges —
  # no user:/cap_drop:/read_only: (repo rule).
  litellm-db:
    image: postgres:16-alpine
    container_name: litellm-db
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: litellm
    volumes:
      - litellm-db-data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  litellm-db-data:

networks:
  frontend-net:
    external: true
    name: homelab_frontend
  backend-net:
    external: true
    name: homelab_backend
