name: open-webui

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "127.0.0.1:8084:8080"
    environment:
      # Connection to LiteLLM (routes: FreeLLMAPI free models + paid keys + Ollama fallback)
      - OPENAI_API_BASE_URL=http://host.docker.internal:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY}
      # Auth + session
      - WEBUI_AUTH=True
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
      - WEBUI_NAME=Homelab Agent
    volumes:
      - ./data:/app/backend/data
    restart: unless-stopped
