<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="M2Lab">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d12"/>
      <stop offset="1" stop-color="#0e1118"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#7c5cff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9c4ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7c5cff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- accent rule -->
  <rect x="80" y="150" width="64" height="4" rx="2" fill="#7c5cff"/>

  <!-- wordmark -->
  <text x="80" y="138" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="-2" fill="url(#word)">M2Lab</text>

  <!-- tagline -->
  <text x="82" y="186" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" letter-spacing="0.5" fill="#8b90a3">The AI-Native Homelab Starter Kit</text>

  <!-- node motif (right) -->
  <g stroke="#7c5cff" stroke-opacity="0.5" stroke-width="1.5" fill="none">
    <circle cx="1010" cy="160" r="10" fill="#7c5cff" fill-opacity="0.18"/>
    <circle cx="1090" cy="110" r="7" fill="#7c5cff" fill-opacity="0.12"/>
    <circle cx="1095" cy="215" r="7" fill="#7c5cff" fill-opacity="0.12"/>
    <circle cx="1140" cy="160" r="9" fill="#7c5cff" fill-opacity="0.18"/>
    <path d="M1020 154 L1083 113"/>
    <path d="M1020 166 L1088 212"/>
    <path d="M1020 160 L1131 160"/>
  </g>
</svg>
